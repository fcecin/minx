name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  linux:
    name: linux (x86_64)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: System deps
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build libboost-all-dev
      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build
      - name: Test
        run: ctest --test-dir build --output-on-failure

  macos:
    name: macos (arm64)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: System deps
        run: brew install cmake ninja boost
      # Examples are Linux developer demos (GNU-ld -z noexecstack, a POSIX
      # poll()/fork harness); the library + tests are the portable contract.
      - name: Configure
        run: >
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
          -DMINX_BUILD_EXAMPLES=OFF
      - name: Build
        run: cmake --build build
      - name: Test
        run: ctest --test-dir build --output-on-failure

  windows:
    name: windows (x86_64)
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4
      - name: MSYS2 / MinGW64 toolchain + deps
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            git
            make
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-cmake
            mingw-w64-x86_64-ninja
            mingw-w64-x86_64-boost
      # Examples are Linux developer demos (GNU-ld -z noexecstack, a POSIX
      # poll()/fork harness); the library + tests are the portable contract.
      - name: Configure
        run: >
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
          -DMINX_BUILD_EXAMPLES=OFF
      - name: Build
        run: cmake --build build
      - name: Test
        run: ctest --test-dir build --output-on-failure
